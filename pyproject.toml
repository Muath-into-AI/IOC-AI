[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ioc-enrich"
version = "0.1.0"
description = "Enrich indicators of compromise (IOCs) from free threat-intel sources and get a clear risk summary."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Muath-into-AI" }]
keywords = ["security", "threat-intelligence", "ioc", "soc", "dfir", "virustotal"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "License :: OSI Approved :: MIT License",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = [
    "httpx>=0.25",
    "rich>=13.0",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.4", "respx>=0.21", "ruff>=0.4"]

[project.scripts]
ioc-enrich = "ioc_enrich.cli:main"

[project.urls]
Homepage = "https://github.com/Muath-into-AI/IOC-AI"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
